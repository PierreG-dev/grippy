<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Mocks API</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white min-h-screen">
    <!-- Navbar -->
    <nav
      class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow"
    >
      <div class="flex gap-4 items-center">
        <a href="/" class="text-white hover:text-blue-400 font-semibold"
          >🏠 Dashboard</a
        >
        <a href="/mocks" class="text-white hover:text-blue-400 font-semibold"
          >🧪 Mocks</a
        >
      </div>
      <div>
        <a
          href="/logout"
          class="text-sm text-gray-300 hover:text-red-400 transition"
          >Déconnexion</a
        >
      </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">🧪 Gestion des routes Mock API</h1>
        <div class="flex gap-4">
          <button
            id="openUpload"
            class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white"
          >
            + Nouvelle route
          </button>
          <a
            href="/admin/mocks/download"
            class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white"
            >📦 Télécharger mocks.json</a
          >
        </div>
      </div>

      <table class="w-full bg-gray-800 rounded shadow overflow-hidden">
        <thead class="bg-gray-700 text-left">
          <tr>
            <th class="p-3">Méthode</th>
            <th class="p-3">URL</th>
            <th class="p-3">Actions</th>
          </tr>
        </thead>
        <tbody id="mockList"></tbody>
      </table>
    </main>

    <!-- Toast -->
    <div
      id="toast"
      class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-700 text-white px-4 py-2 rounded shadow-lg hidden z-50"
    ></div>

    <!-- Modale -->
    <div
      id="uploadModal"
      class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50"
    >
      <div class="bg-gray-800 text-white p-6 rounded shadow-md w-full max-w-md">
        <h2 class="text-lg font-semibold mb-4">
          Créer une nouvelle route mock
        </h2>
        <form id="mockForm">
          <div class="mb-4">
            <label class="block mb-1">Nom de la route (ex: produits)</label>
            <input
              type="text"
              id="path"
              class="w-full px-3 py-2 rounded bg-gray-700 text-white"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block mb-1">Méthode</label>
            <select
              id="method"
              class="w-full px-3 py-2 rounded bg-gray-700 text-white"
            >
              <option>GET</option>
              <option>POST</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="block mb-1">Réponse JSON</label>
            <textarea
              id="response"
              rows="6"
              class="w-full px-3 py-2 rounded bg-gray-700 text-white font-mono"
            >
{}</textarea
            >
          </div>
          <div class="flex justify-end gap-2">
            <button
              type="button"
              id="cancelUpload"
              class="px-4 py-2 rounded bg-gray-600 hover:bg-gray-700"
            >
              Annuler
            </button>
            <button
              type="submit"
              class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white"
            >
              Ajouter
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function toggleModal() {
        document.getElementById("uploadModal").classList.toggle("hidden");
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.remove("hidden");
        setTimeout(() => toast.classList.add("hidden"), 3000);
      }

      async function fetchMocks() {
        const res = await fetch("/admin/mocks.json");
        const data = await res.json();
        const tbody = document.getElementById("mockList");
        tbody.innerHTML = Object.entries(data)
          .map(
            ([path, cfg], i) => `
        <tr class="${
          i % 2 === 0 ? "bg-gray-700" : "bg-gray-800"
        } border-t border-gray-600">
          <td class="p-3 text-green-400 font-mono">${cfg.method}</td>
          <td class="p-3 text-blue-400 font-mono">${path}</td>
          <td class="p-3 flex gap-2 flex-wrap">
            <a href="${path}" target="_blank" class="flex items-center gap-1 bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-sm">
              🔎 <span>Tester</span>
            </a>
            <button onclick="copyFullLink('${path}')" class="flex items-center gap-1 bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm">
              📋 <span>Copier</span>
            </button>
            <button onclick="deleteMock('${path}')" class="flex items-center gap-1 bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm">
              🗑 <span>Supprimer</span>
            </button>
          </td>
        </tr>
      `
          )
          .join("");
      }

      function copyFullLink(path) {
        const fullUrl = window.location.origin + path;
        navigator.clipboard
          .writeText(fullUrl)
          .then(() => showToast("Lien copié !"))
          .catch(() => showToast("Erreur lors de la copie"));
      }

      document
        .getElementById("mockForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            let path = document.getElementById("path").value.trim();
            const method = document.getElementById("method").value;
            const responseText = document.getElementById("response").value;
            const response = responseText.trim()
              ? JSON.parse(responseText)
              : {};

            if (!path.startsWith("/")) path = "/" + path;
            if (!path.startsWith("/api/mock/")) path = "/api/mock" + path;

            const res = await fetch("/admin/mock", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ path, method, response }),
            });
            if (res.ok) {
              toggleModal();
              fetchMocks();
              showToast("Mock ajouté avec succès !");
            } else {
              showToast("Erreur : " + (await res.text()));
            }
          } catch (err) {
            showToast("Erreur JSON : " + err.message);
          }
        });

      async function deleteMock(path) {
        const encoded = encodeURIComponent(path.replace("/api/mock/", ""));
        const confirmed = confirm("Supprimer ce mock ?");
        if (!confirmed) return;
        const res = await fetch(`/admin/mock/${encoded}`, { method: "DELETE" });
        if (res.ok) {
          showToast("Mock supprimé");
          fetchMocks();
        } else {
          showToast("Erreur lors de la suppression");
        }
      }

      document.getElementById("openUpload").onclick = toggleModal;
      document.getElementById("cancelUpload").onclick = toggleModal;
      fetchMocks();
    </script>
  </body>
</html>
