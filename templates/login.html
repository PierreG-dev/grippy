<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 h-screen flex items-center justify-center">
    <form method="POST" class="bg-white p-8 rounded shadow-md w-full max-w-sm">
      <h1 class="text-xl font-bold mb-6 text-center">Connexion Admin</h1>
      {% if error %}
      <div class="bg-red-100 text-red-700 p-2 mb-4 rounded">{{ error }}</div>
      {% endif %}
      <label class="block mb-2 text-sm font-medium">Nom d'utilisateur</label>
      <input
        name="username"
        required
        class="w-full mb-4 px-3 py-2 border rounded"
        type="text"
      />
      <label class="block mb-2 text-sm font-medium">Mot de passe</label>
      <input
        name="password"
        required
        class="w-full mb-6 px-3 py-2 border rounded"
        type="password"
      />
      <button
        class="bg-blue-500 text-white w-full py-2 rounded hover:bg-blue-600"
      >
        Se connecter
      </button>
    </form>
  </body>
</html>
