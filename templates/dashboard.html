<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white min-h-screen">
    <!-- Navbar -->
    <nav
      class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow"
    >
      <div class="flex gap-4 items-center">
        <a href="/" class="text-white hover:text-blue-400 font-semibold"
          >🏠 Dashboard</a
        >
        <a href="/mocks" class="text-white hover:text-blue-400 font-semibold"
          >🧪 Mocks</a
        >
      </div>
      <div>
        <a
          href="/logout"
          class="text-sm text-gray-300 hover:text-red-400 transition"
          >Déconnexion</a
        >
      </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">📁 Dashboard – Fichiers uploadés</h1>
        <div class="flex gap-4">
          <button
            id="openUpload"
            class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white"
          >
            Uploader un fichier
          </button>
          <button
            id="downloadZip"
            class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white"
          >
            Télécharger tout (.zip)
          </button>
        </div>
      </div>

      <table class="w-full bg-gray-800 rounded shadow overflow-hidden">
        <thead class="bg-gray-700 text-left">
          <tr>
            <th class="p-3"></th>
            <th class="p-3">Nom</th>
            <th class="p-3">Taille</th>
            <th class="p-3">Type</th>
            <th class="p-3">Uploadé</th>
            <th class="p-3">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for f in files %}
          <tr
            class="{% if loop.index is even %}bg-gray-700{% else %}bg-gray-800{% endif %} border-t border-gray-600"
          >
            <td class="p-3 w-10">
              <img
                src="{{ f.icon }}"
                alt="icon"
                class="w-6 h-6"
                style="object-fit: cover"
              />
            </td>
            <td class="p-3">{{ f.name }}</td>
            <td class="p-3">{{ (f.size / 1024)|round(1) }} Ko</td>
            <td class="p-3">{{ f.type }}</td>
            <td class="p-3" data-timestamp="{{ f.timestamp }}">
              {{ f.uploaded }}
            </td>
            <td class="p-3 flex gap-2 flex-wrap">
              <button
                onclick="copyLink(window.location.origin + '{{ f.url }}')"
                class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm"
              >
                📋 Copier lien
              </button>
              <button
                onclick="deleteFile('{{ f.name }}')"
                class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm"
              >
                🗑 Supprimer
              </button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </main>

    <!-- Modale Upload -->
    <div
      id="uploadModal"
      class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50"
    >
      <div class="bg-gray-800 text-white p-6 rounded shadow-md w-full max-w-md">
        <h2 class="text-lg font-semibold mb-4">Uploader un fichier</h2>
        <div
          id="dropZone"
          class="w-full h-40 mb-4 border-4 border-dashed border-gray-600 rounded flex items-center justify-center text-gray-400 cursor-pointer text-center"
        >
          Déposez un fichier ici ou cliquez pour choisir
        </div>
        <input type="file" id="fileInput" class="hidden" />
        <div class="flex justify-end gap-2">
          <button
            id="cancelUpload"
            class="px-4 py-2 rounded bg-gray-600 hover:bg-gray-700"
          >
            Annuler
          </button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div
      id="toast"
      class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-700 text-white px-4 py-2 rounded shadow-lg hidden z-50"
    ></div>

    <script>
      const token = {{ api_token | tojson | safe }};

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.remove("hidden");
        setTimeout(() => toast.classList.add("hidden"), 3000);
      }

      function toggleModal() {
        document.getElementById("uploadModal").classList.toggle("hidden");
      }

      function deleteFile(name) {
        const encoded = encodeURIComponent(name);
        fetch(`/api/delete/${encoded}`, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + token },
        })
          .then((res) => res.json())
          .then(() => {
            showToast("Fichier supprimé");
            setTimeout(() => location.reload(), 1000);
          });
      }

      function copyLink(url) {
        navigator.clipboard.writeText(url)
          .then(() => showToast("Lien copié !"))
          .catch(() => showToast("Erreur lors de la copie"));
      }

      function uploadFile(file) {
        const formData = new FormData();
        formData.append("file", file);

        fetch("/api/upload", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
          body: formData,
        })
          .then((res) => res.json())
          .then((res) => {
            if (res.url) {
              showToast("Fichier envoyé");
              toggleModal();
              setTimeout(() => location.reload(), 1000);
            }
          });
      }

      function downloadZip() {
        fetch("/api/backup", {
          method: "GET",
          headers: { Authorization: "Bearer " + token },
        })
          .then((res) => res.blob())
          .then((blob) => {
            const link = document.createElement("a");
            link.href = window.URL.createObjectURL(blob);
            link.download = "backup.zip";
            link.click();
          });
      }

      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");

      dropZone.addEventListener("click", () => fileInput.click());
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("border-blue-400");
      });
      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("border-blue-400");
      });
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("border-blue-400");
        const files = e.dataTransfer.files;
        if (files.length > 0) uploadFile(files[0]);
      });

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) uploadFile(fileInput.files[0]);
      });

      document.getElementById("openUpload").onclick = toggleModal;
      document.getElementById("cancelUpload").onclick = toggleModal;
      document.getElementById("downloadZip").onclick = downloadZip;
    </script>
  </body>
</html>
